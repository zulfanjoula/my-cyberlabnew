        const handleMediaChange = (e) => setIsDesktop(e.matches);

          targetPos.current = { x: e.clientX, y: e.clientY };
          if (!isVisible.current) {
            isVisible.current = true;
            if (glowRef.current) glowRef.current.style.opacity = '1';
            if (gridSpotlightRef.current) gridSpotlightRef.current.style.opacity = '1';
          }
        };

        const onMouseLeave = () => {
          isVisible.current = false;
          if (glowRef.current) glowRef.current.style.opacity = '0.35';
          if (gridSpotlightRef.current) gridSpotlightRef.current.style.opacity = '0.2';
        };

        const onMouseEnter = () => {
          isVisible.current = true;
          if (glowRef.current) glowRef.current.style.opacity = '1';
          if (gridSpotlightRef.current) gridSpotlightRef.current.style.opacity = '1';
        };

        window.addEventListener('mousemove', onMouseMove, { passive: true });
        document.addEventListener('mouseleave', onMouseLeave);
        document.addEventListener('mouseenter', onMouseEnter);

        const render = () => {
          const ease = 0.12;
          currentPos.current.x += (targetPos.current.x - currentPos.current.x) * ease;
          currentPos.current.y += (targetPos.current.y - currentPos.current.y) * ease;

          const x = Math.round(currentPos.current.x);
          const y = Math.round(currentPos.current.y);

          if (glowRef.current) {
            glowRef.current.style.transform = `translate3d(${x - 350}px, ${y - 350}px, 0)`;
          }

          if (gridSpotlightRef.current) {
            const maskValue = `radial-gradient(450px circle at ${x}px ${y}px, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 70%)`;
            gridSpotlightRef.current.style.maskImage = maskValue;
            gridSpotlightRef.current.style.webkitMaskImage = maskValue;
          }

          animFrameId.current = requestAnimationFrame(render);
        };

        animFrameId.current = requestAnimationFrame(render);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseleave', onMouseLeave);
          document.removeEventListener('mouseenter', onMouseEnter);
          mediaQuery.removeEventListener('change', handleMediaChange);
          if (animFrameId.current) cancelAnimationFrame(animFrameId.current);
        };
      }, []);

      return (
        <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
          <div
            className="absolute inset-0 cyber-grid opacity-70"
            style={{
              backgroundImage: `
                linear-gradient(to right, rgba(16, 185, 129, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.04) 1px, transparent 1px)
              `,
              backgroundSize: '36px 36px'
            }}
          />
          {isDesktop && (
            <div
              ref={gridSpotlightRef}
              className="absolute inset-0 transition-opacity duration-700 ease-out opacity-0"
              style={{
                backgroundImage: `
                  linear-gradient(to right, rgba(0, 255, 102, 0.09) 1px, transparent 1px),
                  linear-gradient(to bottom, rgba(0, 255, 102, 0.09) 1px, transparent 1px)
                `,
                backgroundSize: '36px 36px'
              }}
            />
          )}
          {isDesktop && (
            <div
              ref={glowRef}
              className="absolute top-0 left-0 w-[700px] h-[700px] rounded-full transition-opacity duration-700 ease-out opacity-0"
              style={{
                background: 'radial-gradient(circle, rgba(0, 255, 102, 0.075) 0%, rgba(16, 185, 129, 0.035) 40%, rgba(8, 12, 10, 0) 70%)',
                filter: 'blur(45px)',
                willChange: 'transform',
                transform: 'translate3d(-1000px, -1000px, 0)'
              }}
            />
          )}
        </div>
      );
    };

                <h2 className="text-3xl font-bold text-white">My Cybersecurity Journey</h2>
                <div className="w-12 h-1 bg-emerald-500 rounded-full mx-auto mt-3 opacity-60" />
              </div>

              <div className="relative">
                <div className="absolute top-4 bottom-4 left-4 sm:left-1/2 sm:-translate-x-1/2 w-0.5 bg-gradient-to-b from-emerald-500 via-emerald-500/40 to-teal-500/20" />

                <div className="space-y-10">
                  {journeyMilestones.map((step, idx) => {
                    const isEven = idx % 2 === 0;
                    return (
                      <div key={step.id} className={`relative flex flex-col sm:flex-row items-start ${isEven ? 'sm:flex-row-reverse' : ''} gap-6 sm:gap-0`}>
                        <div className="absolute left-4 sm:left-1/2 -translate-x-1/2 top-1 z-20 w-8 h-8 rounded-full bg-[#09110d] border-2 border-[#00ff66] flex items-center justify-center text-[#00ff66] font-mono text-xs font-bold shadow-glow-sm">
                          {step.stepNumber}
                        </div>
                        <div className="hidden sm:block sm:w-1/2" />
                        <div className={`w-full sm:w-1/2 pl-12 sm:pl-0 ${isEven ? 'sm:pr-10' : 'sm:pl-10'}`}>
                          <div className="rounded-xl border border-emerald-500/20 bg-[#0d1612] p-5">
                            <div className="flex items-center justify-between text-xs font-mono text-emerald-400 mb-1">
                              <span>PHASE 0{step.stepNumber}</span>
                              <span className="text-[11px] text-zinc-400">{step.status}</span>
                            </div>
                            <h3 className="text-lg font-bold text-white">{step.title}</h3>
                            <h4 className="text-xs font-mono text-zinc-400 mt-0.5">{step.subtitle}</h4>
                            <p className="mt-3 text-xs sm:text-sm text-zinc-300 leading-relaxed font-sans">{step.description}</p>
                            <div className="mt-3 pt-2 border-t border-emerald-500/10 flex flex-wrap gap-1">
                              {step.keyTopics.map((t, tIdx) => (
                                <span key={tIdx} className="px-2 py-0.5 rounded bg-[#09110d] border border-emerald-500/20 text-[10px] font-mono text-emerald-400">
                                  {t}
                                </span>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* TERMINAL SHOWCASE */}
            <section className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
              <div className="text-center mb-6">
                <div className="inline-block px-3 py-1 rounded-full bg-[#0e1713] border border-emerald-500/25 text-xs font-mono text-emerald-400 mb-2">
                  06 // LEARNING DIRECTIVE
                </div>
                <h3 className="text-xl font-bold text-white">Terminal Directive</h3>
              </div>

              <TerminalFrame title="zulfan@cyberlab" copyText="cat goals.txt\n> Learn cybersecurity\n> Strengthen networking fundamentals\n> Improve Linux skills\n> Practice web security\n> Complete CTF challenges\n> Build practical projects\n> Keep learning">
                <div className="space-y-4">
                  <div className="text-zinc-400">
                    <span className="text-emerald-400 font-semibold">zulfan@cyberlab</span>:<span className="text-cyan-400">~</span>$ cat goals.txt
                  </div>
                  <div className="space-y-2 pl-3 text-zinc-200">
                    {profileData.goalsTerminal.map((g, idx) => (
                      <div key={idx} className="flex items-center gap-2">
                        <span className="text-[#00ff66] font-bold">&gt;</span>
                        <span className="text-emerald-300 font-medium">{g}</span>
                      </div>
                    ))}
                  </div>
                  <div className="pt-2 text-zinc-400 flex items-center">
                    <span className="text-emerald-400 font-semibold">zulfan@cyberlab</span>:<span className="text-cyan-400">~</span>$ <span className="terminal-cursor" />
                  </div>
                </div>
              </TerminalFrame>
            </section>

            {/* PHILOSOPHY CALLOUT */}

                <h3 className="text-2xl sm:text-3xl font-bold text-white">{profileData.philosophyTitle}</h3>
                <p className="text-base sm:text-lg text-zinc-300 max-w-2xl mx-auto leading-relaxed">
                  &ldquo;{profileData.philosophyText}&rdquo;
                </p>
                <div className="text-xs font-mono text-emerald-400 pt-2">
                  ● DEDICATED TO HONEST PROGRESSION &amp; PRACTICAL MASTERY
                </div>
              </div>
            </section>

            {/* CONTACT SECTION WITH USER LINKS */}

              <div className="text-center mb-12">
                <div className="inline-block px-3 py-1 rounded-full bg-[#0e1713] border border-emerald-500/25 text-xs font-mono text-emerald-400 mb-2">
                  07 // TRANSMISSION &amp; NETWORK
                </div>
                <h2 className="text-3xl font-bold text-white">Let&apos;s Connect</h2>
                <div className="w-12 h-1 bg-emerald-500 rounded-full mx-auto mt-3 opacity-60" />
                <p className="mt-3 text-sm text-zinc-300 max-w-xl mx-auto">{profileData.contactIntro}</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {/* GitHub */}
                <div className="rounded-xl border border-emerald-500/20 bg-[#0e1613] p-6 flex flex-col justify-between">
                  <div>
                    <h4 className="text-lg font-bold text-white">GitHub</h4>
                    <p className="mt-2 text-xs text-zinc-400">Lab repositories, notes, scripts, and documentation.</p>
                    <div className="mt-3 text-xs font-mono text-emerald-400 truncate">github.com/zulfanjoula</div>
                  </div>
                  <div className="mt-5 pt-3 border-t border-emerald-500/15">
                    <a href={profileData.socials.github} target="_blank" rel="noopener noreferrer" className="block text-center py-2 rounded-lg font-mono text-xs bg-[#101b16] text-emerald-300 border border-emerald-500/30 hover:bg-[#14241d]">
                      Visit GitHub ↗
                    </a>
                  </div>
                </div>

                {/* LinkedIn */}
                <div className="rounded-xl border border-emerald-500/20 bg-[#0e1613] p-6 flex flex-col justify-between">
                  <div>
                    <h4 className="text-lg font-bold text-white">LinkedIn</h4>
                    <p className="mt-2 text-xs text-zinc-400">Connect professionally and follow learning milestones.</p>
                    <div className="mt-3 text-xs font-mono text-emerald-400 truncate">zulfan-joula-62b16a386</div>
                  </div>
                  <div className="mt-5 pt-3 border-t border-emerald-500/15">
                    <a href={profileData.socials.linkedin} target="_blank" rel="noopener noreferrer" className="block text-center py-2 rounded-lg font-mono text-xs bg-[#101b16] text-emerald-300 border border-emerald-500/30 hover:bg-[#14241d]">
                      Connect on LinkedIn ↗
                    </a>
                  </div>
                </div>

                {/* Email */}
                <div className="rounded-xl border border-emerald-500/20 bg-[#0e1613] p-6 flex flex-col justify-between">
                  <div>
                    <h4 className="text-lg font-bold text-white">Email</h4>
                    <p className="mt-2 text-xs text-zinc-400">Direct message for discussions, study groups, or inquiries.</p>
                    <div className="mt-3 text-xs font-mono text-emerald-400 truncate">{profileData.socials.email}</div>
                  </div>
                  <div className="mt-5 pt-3 border-t border-emerald-500/15 flex gap-2">
                    <a href={`mailto:${profileData.socials.email}`} className="flex-1 text-center py-2 rounded-lg font-mono text-xs bg-[#101b16] text-emerald-300 border border-emerald-500/30 hover:bg-[#14241d]">
                      Send Email ✉
                    </a>
                    <button onClick={handleCopyEmail} className="px-3 py-2 rounded-lg bg-[#0e1713] border border-emerald-500/30 text-xs font-mono text-emerald-300">
                      {copiedEmail ? '✓' : '⧉'}
                    </button>
                  </div>
                </div>
              </div>
            </section>

          </main>

          {/* FOOTER */}
          <footer className="border-t border-emerald-500/15 bg-[#050807] py-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="text-center md:text-left font-mono">
                <div className="text-white font-bold text-sm">ZULFAN JAULA</div>
                <div className="text-xs text-emerald-400">Cybersecurity Student • Learning • Practicing • Building</div>
              </div>
              <div className="font-mono text-xs text-center md:text-right space-y-1">
                <div className="px-3 py-1 rounded bg-[#0b1310] border border-emerald-500/20 text-[#00ff66]">
                  &gt; connection closed successfully.
                </div>
                <div className="text-[11px] text-zinc-500">&copy; 2026 Zulfan Jaula. All educational rights reserved.</div>
              </div>
            </div>
          </footer>

          {/* PROJECT DETAILS MODAL */}
          <Modal
            isOpen={!!selectedProject}
            onClose={() => setSelectedProject(null)}
            title={`LAB DETAILS // ${selectedProject?.category}`}
          >
            {selectedProject && (
              <div className="space-y-5">
                <div className="flex justify-between items-center pb-3 border-b border-emerald-500/15">
                  <h4 className="text-xl font-bold text-white">{selectedProject.name}</h4>
                  <StatusBadge status={selectedProject.status} size="md" />
                </div>
                <p className="text-zinc-300 text-sm">{selectedProject.description}</p>
                <div>
                  <div className="text-xs font-mono text-emerald-400 font-semibold mb-2">LEARNING OBJECTIVES:</div>
                  <ul className="space-y-1.5 text-sm text-zinc-300">
                    {selectedProject.objectives.map((o, idx) => (
                      <li key={idx} className="flex items-start gap-2">
                        <span className="text-emerald-400">▸</span> <span>{o}</span>
                      </li>
                    ))}
                  </ul>
                </div>
                <div>
                  <div className="text-xs font-mono text-amber-400 font-semibold mb-2">KEY TAKEAWAYS:</div>
                  <ul className="space-y-1.5 text-sm text-zinc-300">
                    {selectedProject.keyTakeaways.map((k, idx) => (
                      <li key={idx} className="flex items-start gap-2">
                        <span className="text-amber-400">✓</span> <span>{k}</span>
                      </li>
                    ))}
                  </ul>
                </div>
                <div>
                  <div className="text-xs font-mono text-zinc-400 font-semibold mb-2">KEY SYNTAX PRACTICED:</div>
                  <div className="bg-[#080d0b] border border-emerald-500/20 rounded p-3 font-mono text-xs text-emerald-300 space-y-1">
                    {selectedProject.commandsPracticed.map((c, idx) => (
                      <div key={idx}>$ {c}</div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </Modal>

          {/* CERTIFICATE LIGHTBOX MODAL WITH REAL CERTIFICATE IMAGE */}
          <Modal
            isOpen={!!selectedCert}
            onClose={() => setSelectedCert(null)}
            title="CERTIFICATE VERIFICATION & DETAILS"
            maxWidth="max-w-5xl"
          >
            {selectedCert && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <div className="lg:col-span-7">
                  <div className="aspect-[4/3] w-full rounded-xl overflow-hidden border border-emerald-500/25 bg-[#080d0b] flex items-center justify-center p-3">
                    <img
                      src={selectedCert.image}
                      alt={selectedCert.title}
                      className="max-h-full max-w-full object-contain rounded"
                    />
                  </div>
                  <div className="mt-2 text-xs font-mono text-zinc-500 text-center">
                    FILE: {selectedCert.image}
                  </div>
                </div>

                <div className="lg:col-span-5 space-y-4">
                  <div>
                    <span className="text-[11px] font-mono px-2 py-0.5 rounded bg-emerald-950 text-[#00ff66] border border-emerald-500/30">
                      CERTIFICATE
                    </span>
                    <h4 className="text-xl font-bold text-white mt-2">{selectedCert.title}</h4>
                  </div>

                  <div className="p-3 rounded-lg bg-[#090f0c] border border-emerald-500/15 font-mono text-xs space-y-1 text-zinc-300">
                    <div>Issued by: <span className="text-emerald-300 font-semibold">{selectedCert.issuer}</span></div>
                    <div>Date: <span className="text-white">{selectedCert.date}</span></div>
                  </div>

                  <div>
                    <div className="text-xs font-mono font-semibold uppercase text-emerald-400 mb-1">About This Certificate:</div>
                    <p className="text-xs sm:text-sm text-zinc-300 leading-relaxed bg-[#0a110e] p-3 rounded border border-emerald-500/10">
                      {selectedCert.fullDescription}
                    </p>
                  </div>

                  <div>
                    <div className="text-xs font-mono font-semibold uppercase text-zinc-400 mb-1.5">Key Topics Covered:</div>
                    <div className="flex flex-wrap gap-1.5">
                      {selectedCert.skillsCovered.map((s, idx) => (
                        <span key={idx} className="px-2 py-0.5 rounded bg-[#0f1915] border border-emerald-500/20 text-xs font-mono text-emerald-300">
                          ✓ {s}
                        </span>
                      ))}
                    </div>
                  </div>

                  {selectedCert.credentialUrl && (
                    <div className="pt-2">
                      <a
                        href={selectedCert.credentialUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="block w-full py-2.5 text-center rounded-lg font-mono text-xs font-semibold bg-emerald-500 hover:bg-[#00ff66] text-[#06100b] transition-all"
                      >
                        Verify Certificate ↗
                      </a>
                    </div>
                  )}
                </div>
              </div>
            )}
          </Modal>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
