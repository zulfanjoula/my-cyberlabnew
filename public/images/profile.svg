<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1411" />
      <stop offset="100%" stop-color="#080c0a" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Subtle grid -->
  <g opacity="0.1" stroke="#00ff66" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
  </g>

  <!-- Shield & Terminal Avatar -->
  <circle cx="200" cy="170" r="75" fill="#121d18" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" filter="url(#subtleGlow)" />
  
  <!-- Terminal Prompt Icon -->
  <path d="M 180 150 L 195 165 L 180 180" fill="none" stroke="#00ff66" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="202" y1="180" x2="220" y2="180" stroke="#00ff66" stroke-width="3.5" stroke-linecap="round" />

  <!-- Status pill -->
  <rect x="110" y="275" width="180" height="32" rx="16" fill="#111c16" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="128" cy="291" r="4" fill="#00ff66" />
  <text x="140" y="296" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">STUDENT LAB ID</text>

  <!-- Replace notice -->
  <text x="200" y="340" fill="#6ee7b7" opacity="0.8" font-family="monospace" font-size="11" text-anchor="middle">Replace with /images/profile.jpg</text>
</svg>
