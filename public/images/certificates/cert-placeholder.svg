<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1713" />
      <stop offset="100%" stop-color="#080c0a" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="16" fill="url(#certBg)" />
  
  <!-- Certificate Outer Border -->
  <rect x="25" y="25" width="750" height="500" rx="10" fill="none" stroke="url(#goldBorder)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Certificate Inner Guilloche Border -->
  <rect x="35" y="35" width="730" height="480" rx="6" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8,4" />

  <!-- Corner Ornaments -->
  <path d="M 45 65 L 45 45 L 65 45" fill="none" stroke="#00ff66" stroke-width="2" />
  <path d="M 755 65 L 755 45 L 735 45" fill="none" stroke="#00ff66" stroke-width="2" />
  <path d="M 45 485 L 45 505 L 65 505" fill="none" stroke="#00ff66" stroke-width="2" />
  <path d="M 755 485 L 755 505 L 735 505" fill="none" stroke="#00ff66" stroke-width="2" />

  <!-- Security Emblem / Ribbon -->
  <circle cx="400" cy="140" r="45" fill="#121d18" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" />
  <polygon points="400,115 412,125 427,125 432,140 444,150 435,162 435,177 420,180 410,192 400,185 390,192 380,180 365,177 365,162 356,150 368,140 373,125 388,125" fill="#0d281e" stroke="#00ff66" stroke-width="1.5" />
  
  <!-- Checkmark / Shield inside badge -->
  <path d="M 390 148 L 398 156 L 412 140" fill="none" stroke="#00ff66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Certificate Heading -->
  <text x="400" y="230" fill="#e2e8f0" font-family="sans-serif" font-size="24" font-weight="700" letter-spacing="4" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
  <text x="400" y="260" fill="#10b981" font-family="monospace" font-size="14" letter-spacing="2" text-anchor="middle">CYBERSECURITY LEARNING PROGRAM</text>

  <!-- Decorative line -->
  <line x1="250" y1="285" x2="550" y2="285" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />

  <!-- Placeholder instructions -->
  <text x="400" y="340" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">This is a placeholder for your actual certificate image.</text>
  <text x="400" y="375" fill="#00ff66" font-family="monospace" font-size="14" font-weight="600" text-anchor="middle">[ Drop your image in /public/images/certificates/ ]</text>
  
  <!-- Bottom details -->
  <text x="120" y="470" fill="#64748b" font-family="monospace" font-size="12">ISSUED TO: Cybersecurity Student</text>
  <text x="680" y="470" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">STATUS: VERIFIED LAB</text>
</svg>
